spring:
  profiles:
    active:

  flyway:
    mixed: true
    baseline-on-migrate: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/coupon-con?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 1000  # 원하는 최대 커넥션 수로 변경
  tomcat:
    max-threads: 2000 # 톰캣 스레드 설정

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true



logging:
  level:
    org.apache.ibatis: DEBUG
    java.sql: DEBUG
    jdbc: DEBUG

management:
  metrics:
    web:
      server:
        auto-time-requests: true # HTTP 요청 자동 타이밍 활성화
  endpoints:
    web:
      exposure:
        include: "*"        # 모든 엔드포인트 노출
        exclude:            # 제외할 엔드포인트

  redis:
    lettuce:
      pool:
        max-active: 5
        max-idle: 5
        min-idle: 2
    host: localhost
    port: 6379
    password: 1234