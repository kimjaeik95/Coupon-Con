<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠폰 발급</title>
<style>
  :root{
    --ink:#14171F;
    --ink-soft:#1E222D;
    --paper:#F7F3E8;
    --paper-line:#D9D2BE;
    --flame:#FF5A36;
    --flame-dark:#C23F21;
    --success:#2BB673;
    --muted:#8A8F98;
    --text-on-paper:#2A2620;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,90,54,0.07), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(43,182,115,0.05), transparent 40%);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:480px;
  }

  .eyebrow{
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-align:center;
    margin:0 0 10px;
    font-weight:600;
  }

  /* 티켓 카드 */
  .ticket{
    position:relative;
    display:flex;
    background:var(--paper);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
  }

  .ticket-main{
    flex:1;
    padding:28px 24px 24px;
    position:relative;
  }

  .ticket-stub{
    width:132px;
    flex-shrink:0;
    padding:24px 14px;
    background:var(--flame);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    position:relative;
  }

  /* 절취선 (die-cut) */
  .perforation{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0;
    border-left:2px dashed rgba(42,38,32,0.28);
  }
  .notch{
    position:absolute;
    left:-13px;
    width:26px; height:26px;
    background:var(--ink);
    border-radius:50%;
  }
  .notch.top{top:-13px;}
  .notch.bottom{bottom:-13px;}

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .brand-mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--flame);
  }
  .brand-name{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--muted);
  }

  .coupon-title{
    font-size:22px;
    font-weight:800;
    color:var(--text-on-paper);
    margin:0 0 6px;
    line-height:1.3;
  }
  .coupon-desc{
    font-size:13px;
    color:#6B6559;
    margin:0 0 20px;
    line-height:1.6;
  }

  .field{
    margin-bottom:12px;
  }
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:#8A8272;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:9px 11px;
    border-radius:8px;
    border:1.5px solid var(--paper-line);
    background:#FFFDF8;
    font-size:14px;
    color:var(--text-on-paper);
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{
    border-color:var(--flame);
  }

  .stub-label{
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(20,23,31,0.65);
    font-weight:700;
  }

  .issue-btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:13px 10px;
    background:var(--ink);
    color:var(--paper);
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .issue-btn:hover:not(:disabled){
    background:var(--flame-dark);
  }
  .issue-btn:active:not(:disabled){
    transform:scale(0.97);
  }
  .issue-btn:disabled{
    cursor:not-allowed;
    opacity:0.75;
  }

  .spinner{
    display:none;
    width:14px;height:14px;
    border:2px solid rgba(247,243,232,0.35);
    border-top-color:var(--paper);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-right:2px;
  }
  .issue-btn.loading .spinner{display:inline-block;}
  .issue-btn.loading .btn-text{opacity:0.9;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .btn-inner{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .status{
    margin-top:14px;
    min-height:20px;
    font-size:13px;
    font-weight:600;
    text-align:center;
    border-radius:8px;
    padding:0;
    transition:all .2s ease;
  }
  .status.show{
    padding:9px 10px;
  }
  .status.pending{
    background:#FFF1EC;
    color:var(--flame-dark);
  }
  .status.success{
    background:#E9F9F1;
    color:#1A8F5A;
  }
  .status.error{
    background:#FCEBEB;
    color:#B4302F;
  }

  .config-note{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:#4F5563;
  }
  .config-note a{color:#9BB4E8;}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">선착순 발급 </p>

  <div class="ticket">
    <div class="ticket-main">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">MEMBERSHIP COUPON</span>
      </div>

      <h1 class="coupon-title">할인 쿠폰</h1>
      <p class="coupon-desc">재고가 남아있는 동안 선착순으로 발급됩니다.</p>

      <div class="field">
        <label for="couponId">쿠폰 ID</label>
        <input id="couponId" type="number" value="1" placeholder="1">
      </div>
      <div class="field">
        <label for="memberId">회원 ID</label>
        <input id="memberId" type="number" value="1" placeholder="1">
      </div>
    </div>

    <div class="ticket-stub">
      <span class="perforation"></span>
      <span class="notch top"></span>
      <span class="notch bottom"></span>
      <span class="stub-label">쿠폰 발급</span>
      <button class="issue-btn" id="issueBtn" onclick="issueCoupon()">
        <span class="btn-inner">
          <span class="spinner"></span>
          <span class="btn-text" id="btnText">발급받기</span>
        </span>
      </button>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  const btn = document.getElementById('issueBtn');
  const btnText = document.getElementById('btnText');
  const statusEl = document.getElementById('status');


  // 공백으로 여러 클래스를 설정 (status, show, success)
  // 일치하는 CSS 규칙(.status, .status.show, .status.success)이 적용됨
  function setStatus(type, message){
    statusEl.className = 'status show ' + type;
    statusEl.textContent = message;
  }

  // 상태메시지 초기화
  function clearStatus(){
    statusEl.className = 'status';
    statusEl.textContent = '';
  }

  // SSE 구독을 별도 함수로 분리 (connect 이벤트로 연결 완료 확인)
  function subscribeCouponResult(memberId, couponId) {
    // Promise 비동기  결과를 나중에 알려주는 객체 성공(resolve) 또는 실패(reject)
    return new Promise((resolve, reject) => {
      const sse = new EventSource(`/api/coupon/subscribe/${couponId}?memberId=${memberId}`);

      sse.addEventListener('connect', () => resolve(sse));
      sse.onopen = () => console.log("SSE 연결(onopen) 성공!"); // 추가
      // 서버 data 받아서 화면 처리
      sse.addEventListener('coupon-issued', (e) => {
        const data = JSON.parse(e.data);
        setStatus('success', data.message);
        sse.close();
      });

      sse.addEventListener('coupon-issued-fail', (e) => {
        const data = JSON.parse(e.data);
        setStatus('error', data.message);
        sse.close();
      });

      sse.onerror = () => {
        sse.close();
        reject(new Error('SSE 연결 실패'));
      };
    });
  }

  // 버튼 클릭시 (비동기)
  async function issueCoupon(){
    const couponId = document.getElementById('couponId').value.trim();
    const memberId = document.getElementById('memberId').value.trim();

    if(!couponId || !memberId){
      setStatus('error', '쿠폰 ID / 회원 ID 입력 필요');
      return;
    }

    // 클릭 가능 불가능 설정 변수
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = '발급 중...';
    clearStatus();

    try {
      // 1. 먼저 SSE 구독부터 맺고 연결 확인될 때까지 대기
      setStatus('pending', '실시간 알림 연결 중...');
      await subscribeCouponResult(memberId, couponId);

      // 2. 구독이 확실히 연결된 후에 발급 요청 전송
      const url = `/api/coupon/issue/${encodeURIComponent(couponId)}?memberId=${encodeURIComponent(memberId)}`;
      const res = await fetch(url, { method: 'POST' });
      const text = await res.text();

      if(res.ok){
        setStatus('pending', text || '발급 요청 완료. 결과를 기다리는 중...');
      } else {
        setStatus('error', `실패 (${res.status}) ${text}`);
      }

    } catch (err) {
      setStatus('error', '서버 연결 실패');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = '발급받기';
    }
  }
</script>
</body>
</html>
